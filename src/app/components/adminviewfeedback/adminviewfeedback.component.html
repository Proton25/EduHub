<app-adminnav></app-adminnav>
<h1>Admin View Feedback</h1>
<table>
    <thead>
        <tr>
            <th>S.No</th>
            <th>Username</th>
            <th>Date</th>
            <th>Feedbacks</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let fb of feedbacks; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ fb.user?.username }}</td>
            <td>{{ fb.date | date }}</td>
            <td>{{ fb.feedbackText }}</td>
            <td>
                <button (click)="showUserDetails(fb.user)">SHOW DETAILS</button>
            </td>
        </tr>
    </tbody>
</table>

<div class="modal" *ngIf="showPopup">
    <div class="modal-content">
        <span class="close" (click)="closePopup()">&times;</span>
        <h2>User Details</h2>
        <p><strong>Username:</strong> {{ selectedUser?.username }}</p>
        <p><strong>Email:</strong> {{ selectedUser?.email }}</p>
        <p><strong>Mobile Number:</strong> {{ selectedUser?.mobileNumber }}</p>
        <button (click)="closePopup()">Close</button>
    </div>
</div>
