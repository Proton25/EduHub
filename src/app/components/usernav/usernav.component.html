<nav class="ff container">
    <h2>EDU-HUB</h2>
    <p>{{username}} /{{role}}</p>
    <!-- Client-specific navigation items -->
    <a routerLink="/user-home">Home</a>
    <div class="dropdown">
        <a (click)="toggleDropdown()" routerLink="/studentviewCourse">Courses</a>
    </div>
    <a routerLink="/mycourse">Enrolled Course</a>
    <div class="dropdown">
        <a routerLink="/userviewfeedback">Feedbacks</a>
        <div class="dropdown-content" [ngClass]="{'show': dropdownOpen}">
            <a routerLink="/useraddfeedback">Post Feedback</a>
            <a routerLink="/userviewfeedback">View Feedback</a>
        </div>
    </div>
    <button (click)="confirmLogout()">Logout</button>

    <!-- Confirmation Dialog -->
    <div *ngIf="showConfirmationDialog" class="confirmation-dialog-container">
        <div class="confirmation-dialog">
            <p>Are you sure you want to logout?</p>
            <button (click)="logout()">Yes, Logout</button>
            <button (click)="cancelLogout()">Cancel</button>
        </div>
    </div>
