<app-usernav></app-usernav>

<div *ngIf="isLoading">Loading feedbacks...</div>

<div *ngIf="!isLoading && feedbacks.length === 0" class="no-feedback-message">
  <p>No feedback given.</p>
</div>

<table *ngIf="!isLoading && feedbacks.length > 0">
  <thead>
    <tr>
      <th>SNO</th>        
      <th>Feedbacks</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let fb of feedbacks; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ fb.feedbackText }}</td>
      <td>
        <button (click)="confirmDelete(fb.feedbackId)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="showPopup" class="popup">
  <div class="popup-content">
    <p>Are you sure you want to delete?</p>
    <button (click)="deleteFeedback()">Yes, Delete</button>
    <button (click)="closePopup()">Cancel</button>
  </div>
</div>
