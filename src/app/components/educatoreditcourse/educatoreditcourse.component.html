<h1>Edit Course</h1>
<form (ngSubmit)="saveCourse()">
    <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" [(ngModel)]="course.title" required>
    </div>
    <div class="form-group">
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" [(ngModel)]="course.description" required>
    </div>
    <div class="form-group">
        <label for="category">Category:</label>
        <input type="text" id="category" name="category" [(ngModel)]="course.category" required>
    </div>
    <div class="form-group">
        <label for="level">Level:</label>
        <select id="level" name="level" [(ngModel)]="course.level" required>
            <option value="">Select Level</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="expert">Expert</option>
        </select>
    </div>
    <div class="form-group">
        <label for="courseStartDate">Start Date:</label>
        <input type="date" id="courseStartDate" name="courseStartDate" [(ngModel)]="course.courseStartDate" required>
    </div>
    <div class="form-group">
        <label for="courseEndDate">End Date:</label>
        <input type="date" id="courseEndDate" name="courseEndDate" [(ngModel)]="course.courseEndDate" required>
    </div>
    <div class="button-container">
        <button type="submit">Update Course</button>
    </div>
</form>
